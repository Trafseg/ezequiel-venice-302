<script>
'use strict';
// Configure antes de publicar: WhatsApp da imobiliária (país + DDD + número) e URL do webhook da planilha (Google Apps Script).
const WHATSAPP_NUMERO='5547996913998'; // Ezequiel Maia
const IMOVEL='venice-302'; // código do imóvel (vai para a aba da planilha)
const IMOVEL_TITULO='Apartamento à venda – Venice Home Club';
const PLANILHA_WEBHOOK='https://script.google.com/macros/s/AKfycbzNYYkSJIUXOvI5tJUHYW2J-MaDSaQ6jfHthEgKOFH2zKd1pYQcvzgh-CYiUU2j_0Hxog/exec'; // Apps Script do Ezequiel
const questions=[
 {id:'name',group:'Identificação e contato',title:'Como podemos chamar você?',label:'Nome completo',placeholder:'Digite seu nome completo',autocomplete:'name'},
 {id:'phone',group:'Identificação e contato',title:'Qual é o seu WhatsApp?',desc:'Informe seu número com DDD para que um corretor possa falar com você.',label:'WhatsApp com DDD',placeholder:'(51) 99999-9999',autocomplete:'tel-national',type:'tel'},
 {id:'age',group:'Seu perfil',title:'Qual é a sua idade?',options:['18 a 24 anos','25 a 34 anos','35 a 44 anos','45 a 54 anos','55 anos ou mais']},
 {id:'occupation',group:'Seu perfil',title:'Qual sua ocupação hoje?',options:['Sou CLT/concursado','Sou autônomo','Sou aposentado/pensionista','Sou investidor']},
];
// Só estas ocupações contam como Lead para a Meta (pixel e API de Conversões)
const OCUPACOES_QUALIFICADAS=['Sou CLT/concursado','Sou investidor'];
// Lead qualificado = idade entre 18 e 44 anos E ocupação CLT/concursado ou investidor
const IDADES_QUALIFICADAS=['18 a 24 anos','25 a 34 anos','35 a 44 anos'];
const LABELS={name:'Nome',phone:'WhatsApp',age:'Idade',occupation:'Ocupação'};
const novoLeadId=()=>'lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
// Mesmo leadId no envio parcial (depois do WhatsApp) e no completo: o Apps Script atualiza a mesma linha.
let leadId=novoLeadId();
const enviarPlanilha=payload=>{if(PLANILHA_WEBHOOK)fetch(PLANILHA_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(()=>{});};
const answers={};let step=0;let autoAdvanceTimer=null;
const main=document.getElementById('main'),back=document.getElementById('back');
const flow=()=>questions.filter(q=>!q.when||q.when(answers));
const totalSteps=()=>flow().length;
const track=(...args)=>{if(window.fbq)fbq(...args);};
const cookie=name=>(document.cookie.match('(?:^|; )'+name+'=([^;]*)')||[])[1]||'';
// Origem do lead: parâmetros de URL do anúncio da Meta (utm_content={{ad.name}} = imóvel anunciado)
const URL_PARAMS=new URLSearchParams(location.search);
// Nome amigável do imóvel na mensagem do WhatsApp, pelo código do anúncio (a planilha recebe o nome técnico completo)
const IMOVEIS={}; // preencher quando souber o imóvel de cada anúncio
const imovelAmigavel=ad=>IMOVEIS[(ad.match(/^AD\d+/i)||[''])[0].toUpperCase()]||ad;
const ORIGEM={ad:(URL_PARAMS.get('utm_content')||'').trim(),adset:URL_PARAMS.get('utm_term')||'',campaign:URL_PARAMS.get('utm_campaign')||'',source:URL_PARAMS.get('utm_source')||''};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function focusTitle(){main.querySelector('h1,h2')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function render(){
 clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;
 const list=flow(),total=totalSteps(),finished=step===list.length;
 document.getElementById('progressArea').hidden=false;back.hidden=step===0;document.getElementById('footerNote').hidden=step>0;
 const completed=finished?total:Math.max(0,step),pct=Math.round(completed/total*100);
 document.getElementById('progressText').textContent=finished?'Formulário concluído':'Etapa '+(step+1)+' de '+total;
 document.getElementById('progressPercent').textContent=pct+'%';
 document.getElementById('fill').style.width=pct+'%';
 document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',pct);
 if(finished){
 const rows=['name','phone','age','occupation'].filter(id=>list.some(q=>q.id===id)).map(id=>[LABELS[id],id]);
 const intro='Olá, Ezequiel! Preenchi o formulário e gostaria de receber opções de imóveis para o meu perfil.';
 const message=intro+'\n\n'+rows.map(([label,id])=>label+': '+answers[id]).join('\n')+'\nImóvel de interesse: '+IMOVEL_TITULO;
 const whatsappLink='https://wa.me/'+WHATSAPP_NUMERO+'?text='+encodeURIComponent(message);
 const leadPhoneDigits=(answers.phone||'').replace(/\D/g,'');
 const payload={};for(const id of Object.keys(LABELS))payload[id]=list.some(q=>q.id===id)?answers[id]:'';
 payload.imovel=IMOVEL; payload.whatsappLink=leadPhoneDigits?'https://wa.me/55'+leadPhoneDigits:'';
 // Mesmo event_id no pixel e na API de Conversões (Apps Script) para a Meta não contar o lead duas vezes
 const eventId='lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
 Object.assign(payload,ORIGEM,{eventId,fbp:cookie('_fbp'),fbc:cookie('_fbc')||(new URLSearchParams(location.search).get('fbclid')?'fb.1.'+Date.now()+'.'+new URLSearchParams(location.search).get('fbclid'):''),pageUrl:location.href,userAgent:navigator.userAgent});
 // Lead qualificado: dispara o evento Lead. Os demais vão para a planilha, mas sem Lead:
 // teste=true faz o Apps Script pular a API de Conversões, e o pixel registra só um evento à parte.
 const qualificado=IDADES_QUALIFICADAS.includes(answers.age)&&OCUPACOES_QUALIFICADAS.includes(answers.occupation);
 if(qualificado)track('track','Lead',{content_name:answers.occupation},{eventID:eventId});
 else{payload.teste=true;track('trackCustom','LeadNaoQualificado',{content_name:answers.occupation});}
 enviarPlanilha(Object.assign(payload,{leadId,status:'Completo'}));
 const firstName=esc(answers.name.trim().split(/\s+/)[0]);
 const desc='Clique abaixo e envie a mensagem no WhatsApp. Um corretor vai separar as melhores opções de imóveis para o seu perfil.';
 main.innerHTML=`<section class="screen thanks"><div class="success" aria-hidden="true">✓</div><div class="eyebrow">Tudo pronto para o próximo passo</div><h1 tabindex="-1">Formulário concluído, <span>${firstName}!</span> 🎉</h1><p class="desc">${desc}</p><a class="primary" id="whatsapp" href="${esc(whatsappLink)}" target="_blank" rel="noopener noreferrer">💬 Falar agora com um corretor no WhatsApp</a><p class="micro">O atendimento começa depois que você envia a mensagem no WhatsApp.</p><div class="summary"><h3>CONFIRA SUAS RESPOSTAS</h3><dl>${rows.map(([label,id])=>`<div class="row"><dt>${label}</dt><dd>${esc(answers[id])}</dd></div>`).join('')}</dl></div><button class="restart" id="restart" type="button">Recomeçar formulário</button></section>`;
 document.getElementById('whatsapp').onclick=()=>track('track','Contact');
 document.getElementById('restart').onclick=()=>{for(const key of Object.keys(answers))delete answers[key];leadId=novoLeadId();step=0;render();};
 }else{
 const q=list[step];
 main.innerHTML=`<section class="screen"><p class="mini-headline">Atendimento reservado para quem busca imóveis de alto padrão no litoral catarinense.</p><h2 id="questionTitle" tabindex="-1">${q.title}</h2>${q.desc?`<p class="desc" id="description">${q.desc}</p>`:''}<form id="questionForm" novalidate>${q.options?`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((option,i)=>`<button type="button" class="option" role="radio" aria-checked="${answers[q.id]===option}" data-index="${i}" tabindex="${answers[q.id]===option||(!answers[q.id]&&i===0)?0:-1}"><span class="key" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${option}</span><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div>`:`<input class="field" id="answer" aria-label="${q.label}" aria-describedby="description error" type="${q.type||'text'}" ${q.type==='tel'?'inputmode="tel"':''} autocomplete="${q.autocomplete}" maxlength="${q.type==='tel'?20:140}" placeholder="${q.placeholder}" value="${esc(answers[q.id])}" required>`}<p class="error" id="error" role="alert"></p><div class="actions"><button class="primary" type="submit">${step===list.length-1?'Concluir':'Continuar'} <span class="arrow" aria-hidden="true">→</span></button><span class="hint">pressione Enter ↵${q.options?' · ou escolha uma letra':''}</span></div></form></section>`;
 if(q.options){main.querySelectorAll('.option').forEach(button=>button.onclick=()=>selectOption(Number(button.dataset.index)));}
 else{const input=document.getElementById('answer');input.addEventListener('input',()=>{answers[q.id]=input.value;input.removeAttribute('aria-invalid');document.getElementById('error').textContent='';});if(q.type==='tel')input.addEventListener('input',()=>{let digits=input.value.replace(/\D/g,'');if(digits.startsWith('55')&&digits.length>11)digits=digits.slice(2);digits=digits.slice(0,11);input.value=digits.length>2?'('+digits.slice(0,2)+') '+digits.slice(2,digits.length>10?7:6)+(digits.length>6?'-'+digits.slice(digits.length>10?7:6):''):digits;answers[q.id]=input.value;});}
 document.getElementById('questionForm').onsubmit=event=>{event.preventDefault();advance();};
 }
 focusTitle();
}
function selectOption(index){const q=flow()[step];if(!q?.options?.[index])return;answers[q.id]=q.options[index];main.querySelectorAll('.option').forEach((button,i)=>{button.setAttribute('aria-checked',i===index);button.tabIndex=i===index?0:-1;});document.getElementById('error').textContent='';clearTimeout(autoAdvanceTimer);const selectedStep=step;autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(step===selectedStep)advance();},400);}
function advance(){const q=flow()[step];let value=(answers[q.id]||'').trim(),error='';if(!value)error=q.options?'Selecione uma opção para continuar.':'Preencha este campo para continuar.';else if(q.id==='name'&&value.length<2)error='Informe seu nome.';else if(q.id==='phone'&&!/^[1-9]{2}\d{8,9}$/.test(value.replace(/\D/g,'')))error='Informe um número válido com DDD (10 ou 11 dígitos).';if(error){document.getElementById('error').textContent=error;const input=document.getElementById('answer');if(input){input.setAttribute('aria-invalid','true');input.focus();}return;}answers[q.id]=value;if(q.id==='phone'){track('trackCustom','EtapaWhatsApp');if(step<flow().length-1){const d=answers.phone.replace(/\D/g,'');enviarPlanilha(Object.assign({name:answers.name,phone:answers.phone,whatsappLink:'https://wa.me/55'+d},ORIGEM,{leadId,status:'Parcial',teste:true,imovel:IMOVEL}));}}step++;render();}
back.onclick=()=>{if(step>0){step--;render();}};
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.altKey||event.metaKey||event.target.matches('input,textarea'))return;const q=flow()[step];if(q?.options){const key=event.key.toUpperCase();if(/^[A-E]$/.test(key)){const index=key.charCodeAt(0)-65;if(index<q.options.length){event.preventDefault();selectOption(index);main.querySelectorAll('.option')[index].focus();}}else if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(event.key)){event.preventDefault();const current=q.options.indexOf(answers[q.id]);const index=(Math.max(current,0)+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+q.options.length)%q.options.length;selectOption(index);main.querySelectorAll('.option')[index].focus();}else if(event.key==='Enter'&&!event.target.matches('.primary,.back')){event.preventDefault();advance();}}});
track('track','ViewContent');
render();
</script>
</body>
</html>
